
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #03060b;
            color: white;
            font-family: Arial, sans-serif;

            overflow: hidden;
        }

        /* Background grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.04) 1px, transparent 1px);

            background-size: 45px 45px;

            transform:
                perspective(500px)
                rotateX(60deg)
                scale(1.5);

            transform-origin: bottom;
        }

        /* Ambient glow */
        .glow {
            position: fixed;

            width: 500px;
            height: 500px;

            background: #00ffff;
            filter: blur(180px);

            opacity: 0.08;
            border-radius: 50%;
        }

        /* Main card */
        .register-container {
            position: relative;

            width: 430px;
            padding: 40px;

            background: rgba(5, 12, 20, 0.94);

            border: 1px solid rgba(0, 255, 255, 0.5);

            box-shadow:
                0 0 25px rgba(0, 255, 255, 0.15),
                inset 0 0 30px rgba(0, 255, 255, 0.03);

            backdrop-filter: blur(15px);
        }

        /* Futuristic corners */
        .register-container::before {
            content: "";

            position: absolute;

            top: -1px;
            left: -1px;

            width: 60px;
            height: 60px;

            border-top: 3px solid #00ffff;
            border-left: 3px solid #00ffff;
        }

        .register-container::after {
            content: "";

            position: absolute;

            bottom: -1px;
            right: -1px;

            width: 60px;
            height: 60px;

            border-bottom: 3px solid #00ffff;
            border-right: 3px solid #00ffff;
        }

        /* Header */
        .system {
            color: #00ffff;

            font-size: 10px;
            letter-spacing: 4px;

            margin-bottom: 12px;
        }

        h1 {
            font-size: 34px;

            letter-spacing: 4px;

            margin-bottom: 8px;

            text-shadow:
                0 0 10px #00ffff,
                0 0 25px rgba(0, 255, 255, 0.5);
        }

        .subtitle {
            color: #71818f;

            font-size: 12px;

            margin-bottom: 28px;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            color: #7b929e;

            font-size: 10px;

            letter-spacing: 2px;

            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;

            padding: 13px 12px;

            background: #050b12;

            border: 1px solid #263b46;

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #40515a;
        }

        .input-group input:focus {
            border-color: #00ffff;

            box-shadow:
                0 0 10px rgba(0, 255, 255, 0.25),
                inset 0 0 10px rgba(0, 255, 255, 0.05);
        }

        /* Password requirements */
        .requirements {
            margin-top: -5px;
            margin-bottom: 20px;

            font-size: 9px;

            color: #50616a;

            letter-spacing: 1px;
        }

        /* Terms */
        .terms {
            display: flex;
            align-items: flex-start;

            gap: 8px;

            color: #647781;

            font-size: 10px;

            line-height: 1.5;

            margin-bottom: 22px;
        }

        .terms input {
            margin-top: 2px;
        }

        .terms a {
            color: #00ffff;
            text-decoration: none;
        }

        /* Button */
        button {
            width: 100%;

            padding: 15px;

            background: transparent;

            border: 1px solid #00ffff;

            color: #00ffff;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 4px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #00ffff;

            color: #020608;

            box-shadow:
                0 0 15px #00ffff,
                0 0 40px rgba(0, 255, 255, 0.5);
        }

        /* Login link */
        .login {
            text-align: center;

            margin-top: 22px;

            color: #647781;

            font-size: 11px;
        }

        .login a {
            color: #00ffff;

            text-decoration: none;

            margin-left: 5px;
        }

        .login a:hover {
            text-shadow: 0 0 8px #00ffff;
        }

        /* Bottom status */
        .status {
            margin-top: 22px;

            padding-top: 13px;

            border-top: 1px solid #17252d;

            color: #40545e;

            font-size: 8px;

            letter-spacing: 2px;

            text-align: center;
        }

        .online {
            display: inline-block;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #00ffff;

            box-shadow: 0 0 8px #00ffff;

            margin-right: 7px;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .register-container {
                width: 90%;

                padding: 30px 24px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <div class="register-container">

        <div class="system">
            SYSTEM // REGISTRATION
        </div>

        <h1>CREATE ACCOUNT</h1>

        <p class="subtitle">
            Initialize your identity in the system
        </p>

        <form>

            <!-- Username -->
            <div class="input-group">

                <label>USERNAME</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    id="Name"
                    required
                >

            </div>

            <!-- Email -->
            <div class="input-group">

                <label>EMAIL ADDRESS</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    id="Email"
                    required
                >

            </div>

            <!-- Password -->
            <div class="input-group">

                <label>ACCESS KEY</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    id="userPassword"
                    required
                >

            </div>

            <div class="requirements">
                MINIMUM 8 CHARACTERS // USE A STRONG PASSWORD
            </div>

            <!-- Confirm password -->
            <div class="input-group">

                <label>CONFIRM ACCESS KEY</label>

                <input
                    type="password"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    id="confimedPassword"
                    required
                >

            </div>

            <!-- Terms -->
            <label class="terms">

                <input type="checkbox" required>

                <span>
                    I agree to the
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>

            </label>

            <!-- Submit -->
            <button type="submit" onclick="createAccount()">
                CREATE ACCOUNT
            </button>

        </form>

        <div class="login">
            Already registered?
            <a href="signin.html">SIGN IN</a>
        </div>

        <div class="status">
            <span class="online"></span>
            SECURE REGISTRATION // ONLINE
        </div>

    </div>

    <script>


        async function createAccount(){

            const Name=document.getElementById("Name").Value;

            const Email=document.getElementById("Email").Value;

            const Password=document.getElemntById("Password").value;


            const response=await fetch("",{
                method:"POST",
                data:JSON.stringify(Name,Email,Password)
            });

            const recieved=await response.json();
        }
    </script>

</body>
</html>
